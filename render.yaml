services:
  - type: web
    name: sanction
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: WEBHOOK_SECRET
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_REQUESTS_DB_ID
        sync: false
      - key: NOTION_BUDGETS_DB_ID
        sync: false
      - key: NOTION_RUNLOG_DB_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: ACCOUNTS_EMAIL
        sync: false