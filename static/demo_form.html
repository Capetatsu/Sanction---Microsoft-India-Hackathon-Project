<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sanction — Submit an expense request</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; }
    input, textarea, button { width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0; }
    textarea { height: 90px; }
    #result { white-space: pre-wrap; background: #f2f2f2; padding: 12px; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <h1>Sanction</h1>
  <p>Club expense request — hits the live backend, no scripts.</p>
  <form id="form">
    <label>Your name</label>
    <input id="name" required>
    <label>Contact (email)</label>
    <input id="contact" required>
    <label>What do you need, in your own words</label>
    <textarea id="text" required></textarea>
    <button type="submit">Submit expense request</button>
  </form>
  <pre id="result"></pre>
  <script>
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const payload = {
        idempotency_key: "demo-" + crypto.randomUUID(),
        requester_name: document.getElementById("name").value.trim(),
        requester_contact: document.getElementById("contact").value.trim(),
        raw_text: document.getElementById("text").value.trim(),
      };
      const res = await fetch("/demo/request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const out = document.getElementById("result");
      out.style.display = "block";
      out.textContent = res.status + "\n" + JSON.stringify(await res.json(), null, 2);
    };
  </script>
</body>
</html>
